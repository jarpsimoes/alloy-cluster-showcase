{{- if not .Values.apps }}
{{- fail "values.apps must contain at least one app definition" }}
{{- end }}
{{- $root := . -}}
{{- range $index, $app := .Values.apps }}
{{- $name := required (printf "apps[%d].name is required" $index) $app.name -}}
{{- $namespace := required (printf "apps[%d].namespace is required" $index) $app.namespace -}}
{{- $appVersion := required (printf "apps[%d].version is required" $index) $app.version -}}
{{- $appEnv := required (printf "apps[%d].env is required" $index) $app.env -}}
{{- $appLog := required (printf "apps[%d].log is required" $index) $app.log -}}
{{- $interval := required (printf "apps[%d].interval is required" $index) $app.interval -}}
{{- $repo := required "values.image.repository is required" $root.Values.image.repository -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $root.Release.Name $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ printf "%s-%s" $root.Release.Name $name | trunc 63 | trimSuffix "-" }}
{{ include "app-logs-metrics-engine.labels" $root | indent 4 }}
spec:
  replicas: {{ default 1 $app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ printf "%s-%s" $root.Release.Name $name | trunc 63 | trimSuffix "-" }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ printf "%s-%s" $root.Release.Name $name | trunc 63 | trimSuffix "-" }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ toString $root.Values.containerPort | quote }}
    spec:
      containers:
        - name: app
          image: "{{ $repo }}:{{ default $root.Values.image.tag $app.imageTag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $root.Values.containerPort }}
              protocol: TCP
          env:
            - name: APP_NAME
              value: {{ $name | quote }}
            - name: APP_VERSION
              value: {{ $appVersion | quote }}
            - name: APP_ENV
              value: {{ $appEnv | quote }}
            - name: LOG_LEVEL
              value: {{ $appLog | quote }}
            - name: RANDOM_INTERVAL_SECONDS
              value: {{ $interval | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ toString $root.Values.containerPort | quote }}
          resources:
{{ toYaml $root.Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" $root.Release.Name $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ printf "%s-%s" $root.Release.Name $name | trunc 63 | trimSuffix "-" }}
{{ include "app-logs-metrics-engine.labels" $root | indent 4 }}
spec:
  type: {{ $root.Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ printf "%s-%s" $root.Release.Name $name | trunc 63 | trimSuffix "-" }}
  ports:
    - name: http
      port: {{ $root.Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
